name: iOS EAS Build (manual)

# Signed device / TestFlight build through EAS Build (cloud Mac).
# Requires the repository secret EXPO_TOKEN (Expo access token) and that Apple
# credentials were already configured once for this project with
# `eas credentials` or a first interactive `eas build -p ios` run.
# Trigger it from Actions -> "iOS EAS Build (manual)" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (preview = internal/ad-hoc, production = App Store / TestFlight)'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  eas-build:
    name: EAS iOS build (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install JS dependencies
        run: npm ci

      - name: Start EAS iOS build
        env:
          EXPO_NO_TELEMETRY: '1'
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive
